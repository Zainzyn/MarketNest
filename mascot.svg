  <path d="M28 95 Q35 88 42 92 Q50 84 58 90 Q66 82 74 88 Q82 83 92 95" fill="none" stroke="#00d4a1" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M32 98 Q40 93 48 96 Q55 90 63 94 Q70 87 78 92 Q85 89 88 98" fill="none" stroke="#00d4a1" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Body -->
