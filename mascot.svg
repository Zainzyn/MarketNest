  <path d="M52 72 L56 66 L60 70 L68 62" fill="none" stroke="#00d4a1" stroke-width="2" stroke-linecap="round"/>
  <path d="M65 62 L68 62 L68 65" fill="none" stroke="#00d4a1" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d1832" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#142240" stop-opacity="0.9"/>
    </linearGradient>
