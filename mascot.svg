  <ellipse cx="60" cy="68" rx="22" ry="26" fill="url(#bodyGrad)"/>
  
  <!-- Belly -->
  <ellipse cx="60" cy="74" rx="14" ry="16" fill="#0d1832" opacity="0.6"/>
  
  <!-- Head -->
