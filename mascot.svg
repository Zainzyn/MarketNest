  <circle cx="67.5" cy="37.5" r="2" fill="#ffffff"/>
  <circle cx="64" cy="40" r="1" fill="#ffffff" opacity="0.5"/>
  
  <!-- Beak -->
  <path d="M74 44 L82 42 L74 46 Z" fill="#f5a623"/>
  
  <!-- Wing -->
  <path d="M38 60 Q30 70 34 82 Q42 78 46 68 Z" fill="#00d4a1" opacity="0.8"/>
  <path d="M40 64 Q34 72 36 78" fill="none" stroke="#0a1a2e" stroke-width="1" opacity="0.4"/>
  
  <!-- Headset -->
  <path d="M44 34 Q44 24 60 24 Q76 24 76 34" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="41" y="32" width="7" height="10" rx="3" fill="#7c3aed"/>
  <rect x="72" y="32" width="7" height="10" rx="3" fill="#7c3aed"/>
